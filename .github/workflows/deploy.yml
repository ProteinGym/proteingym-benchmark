name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # Half an hour after sync-datasets.yml. Its push runs as GITHUB_TOKEN,
    # which cannot trigger a workflow, so this is what puts a freshly synced
    # manifests.json on the site.
    - cron: '30 */6 * * *'
  workflow_dispatch:

# gh-pages pushes the build to a branch, so only contents is needed
permissions:
  contents: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The website globs /models/*/README.md at build time, and the model
          # cards live in the proteingym-models submodule. Without this the site
          # builds with no models at all.
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Deploy to GitHub Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://git:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          npx gh-pages -d build -t
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}