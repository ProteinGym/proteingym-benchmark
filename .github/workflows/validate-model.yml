name: validate-model

# Validates models through the real DVC pipelines on the dummy CI dataset.
#
# Runs in three situations:
#
#   * a pull request in ProteinGym/proteingym-models (which calls this workflow
#     as a reusable one). The benchmark is checked out at main and the pull
#     request head is overlaid at models/, so a model submission needs no edit
#     in this repository at all.
#   * a pull request here, which validates the pipelines against the models/
#     submodule.
#   * by hand, with a list of model folders to validate.
#
# models.json is never edited by a contributor: it is synthesised from the model
# cards by scripts/generate_models_list.py, so a new model folder is picked up
# automatically. The committed lists stay the published set.

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      models:
        description: "Comma-separated model folders to validate"
        type: string
        default: "blosum62,pls"
  pull_request:
    branches: main

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      packages: write
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      REGISTRY: ghcr.io
      # false when a model submission in proteingym-models called us
      OWN_PR: ${{ github.repository == 'ProteinGym/proteingym-benchmark' }}

    steps:
      # ---------------------------------------------------------------- checkout
      - name: Check out the benchmark (own pull request)
        if: env.OWN_PR == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          submodules: recursive

      - name: Check out the benchmark (model submission)
        if: env.OWN_PR != 'true'
        uses: actions/checkout@v4
        with:
          repository: ProteinGym/proteingym-benchmark
          ref: main
          fetch-depth: 0
          lfs: true

      - name: Overlay the submitted models at the pull request head
        if: env.OWN_PR != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: models
          fetch-depth: 0

      # ------------------------------------------------------------ environment
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install requirements
        run: pip install -r requirements.txt

      # `--only` reads one card, so a clashing name or a missing game tag hides
      # from it and surfaces in bump-models-pin.yml, where it stops the pin.
      - name: Check every model card
        run: python -m scripts.generate_models_list --validate

      # --------------------------------------------------------- which models?
      - name: Work out which models to validate
        id: scope
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          REPRESENTATIVE: blosum62,pls
          DISPATCH_MODELS: ${{ github.event.inputs.models }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # No "validate everything" switch: the whole zoo exceeds a runner's
            # disk and 6-hour limit, and poet/progen3 need a GPU.
            changed="${DISPATCH_MODELS:-$REPRESENTATIVE}"
          elif [ "$OWN_PR" != "true" ]; then
            # A model submission: compare the overlaid checkout against its
            # base. FETCH_HEAD is used because a ref-pinned checkout does not
            # reliably create origin/<branch>.
            git -C models fetch --no-tags origin "$BASE_REF"
            changed_files=$(git -C models diff --name-only FETCH_HEAD...HEAD)
            # Keep only top-level directories that are really model folders, so
            # a pull request touching .github/ or docs/ does not look like one.
            # A model folder is a model card plus a Dockerfile: the card is what
            # generate_models_list reads, the Dockerfile what we build. Anything
            # with only one of the two cannot be validated, so skip it here
            #
            # `|| true`: grep exits 1 for a pull request that touches only
            # root-level files, and the filter exits 1 when its last candidate
            # is not a model folder. Under `set -e -o pipefail` either would
            # kill this step instead of yielding empty list
            changed=$(echo "$changed_files" | grep -oE '^[^/]+/' | sed 's#/$##' \
                      | sort -u \
                      | while read -r d; do
                          if [ -f "models/$d/Dockerfile" ] && [ -f "models/$d/README.md" ]; then
                            echo "$d"
                          fi
                        done | paste -sd, - || true)
            # A change to shared docs/config touches no model folder.
            [ -z "$changed" ] && changed=NONE
          else
            # Our own pull request: a change to the pipelines, the scripts or the
            # models pin is validated against a small representative pair -- one
            # zero-shot and one supervised model, both fast and dependency-light.
            # Building more of them on one runner exhausts its disk, so a wider
            # run is opt-in: dispatch the workflow by hand with a models list.
            git fetch --no-tags origin "$BASE_REF"
            changed_files=$(git diff --name-only FETCH_HEAD...HEAD)
            if echo "$changed_files" | grep -qE '^(benchmark/|scripts/|models$|requirements\.txt$)'; then
              changed="$REPRESENTATIVE"
              echo "::notice::validating the representative pair ($REPRESENTATIVE). Run this workflow by hand with a models list to validate others."
            else
              changed=NONE
            fi
          fi

          # The build loop skips an unknown name, leaving a green job that
          # validated nothing.
          if [ "$changed" != NONE ]; then
            for model_name in ${changed//,/ }; do
              if [ ! -f "models/$model_name/Dockerfile" ] || [ ! -f "models/$model_name/README.md" ]; then
                echo "::error::'$model_name' is not a model folder: models/$model_name needs a Dockerfile and a README.md"
                exit 1
              fi
            done
          fi

          echo "changed_models=$changed" >> $GITHUB_OUTPUT
          if [ "$changed" = NONE ]; then
            echo "::notice::no model folder changed; nothing to validate"
          else
            echo "Models to validate: $changed"
          fi

      # kermut and pkermut vendor their upstream sources as LFS zips, and a
      # pointer reaches the build as "not a zip file". Only the models being
      # built are pulled: the whole zoo is ~88 MB of LFS per run.
      - name: Fetch the LFS objects of the models being validated
        if: steps.scope.outputs.changed_models != 'NONE'
        env:
          CHANGED_MODELS: ${{ steps.scope.outputs.changed_models }}
        run: |
          set -euo pipefail
          patterns=""
          for model_name in ${CHANGED_MODELS//,/ }; do
            patterns="${patterns:+$patterns,}$model_name/**"
          done
          git -C models lfs pull --include="$patterns"

      # ---------------------------------------------------- disk and datasets
      - name: Reclaim runner disk
        if: steps.scope.outputs.changed_models != 'NONE'
        run: |
          # A runner has ~14 GB free and these images reach several GB. Dropping
          # toolchains we never use reclaims about 40 GB.
          #
          # Do NOT add $AGENT_TOOLSDIRECTORY (/opt/hostedtoolcache) here,
          # however often the snippets online do: it holds the Python
          # actions/setup-python installed, and everything pip put in it.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/share/powershell || true
          df -h / | tail -1

          # Fail here, not 20 minutes into a docker build, if the above took out
          # something we depend on.
          python -c "import dvc, polars, proteingym.base"

      - name: Set up CI datasets
        if: steps.scope.outputs.changed_models != 'NONE'
        run: |
          cp .github/workflows/ci_datasets.json benchmark/supervised/datasets.json
          cp .github/workflows/ci_datasets.json benchmark/zero_shot/datasets.json
          # Start from an empty metrics.csv so the report covers only this run.
          rm -f benchmark/metrics.csv

      - name: Log in to GitHub Container Registry
        if: steps.scope.outputs.changed_models != 'NONE'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # -------------------------------------------------- build, run, then prune
      - name: Build, validate and prune each model in turn
        id: validate_models
        if: steps.scope.outputs.changed_models != 'NONE'
        env:
          # Only a pull request from this repository can push to the private
          # GHCR cache; a submission from a fork always builds locally.
          CAN_USE_CACHE: ${{ github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch' }}
          CHANGED_MODELS: ${{ steps.scope.outputs.changed_models }}
        run: |
          set -uo pipefail
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          failed=""

          # One model at a time: build (or pull) it, run the pipeline, then
          # delete the image before moving on. Building every image up front and
          # only then running dvc exhausts the runner's disk.
          for model_folder in models/*/; do
            # Same pair as the scope step above: card + Dockerfile.
            [ -f "${model_folder}Dockerfile" ] && [ -f "${model_folder}README.md" ] \
              || continue
            model_name=$(basename "$model_folder")

            case ",${CHANGED_MODELS}," in
              *",${model_name},"*) ;;
              *) continue ;;
            esac

            echo "::group::${model_name}"
            hash=$(git -C models ls-files -s "$model_name" | git hash-object --stdin)
            hash=${hash:0:12}
            remote="${REGISTRY}/${OWNER}/${model_name}:${hash}"

            # The generated models.json always names <folder>:latest, so tag
            # whatever we end up with as that and no JSON rewriting is needed.
            if [ "$CAN_USE_CACHE" = "true" ] && docker manifest inspect "$remote" > /dev/null 2>&1 \
                 && docker pull -q "$remote" && docker tag "$remote" "${model_name}:latest"; then
              echo "Reused the cached image for ${model_name}"
            elif docker build -f "${model_folder}Dockerfile" -t "${model_name}:latest" "$model_folder"; then
              if [ "$CAN_USE_CACHE" = "true" ]; then
                docker tag "${model_name}:latest" "$remote"
                docker push -q "$remote" || echo "::warning::could not cache ${remote}"
              fi
            else
              echo "::error title=${model_name}::image failed to build"
              failed="${failed} ${model_name}(build)"
              echo "::endgroup::"
              continue
            fi

            # models.json limited to this one model, derived from its card.
            # Must not be skipped on failure: the previous iteration's file is
            # still on disk, and dvc would silently revalidate that model.
            if ! python -m scripts.generate_models_list --only "$model_name"; then
              echo "::error title=${model_name}::model card is not usable"
              failed="${failed} ${model_name}(card)"
              echo "::endgroup::"
              continue
            fi

            for game in supervised zero_shot; do
              if [ "$(jq '.models | length' benchmark/$game/models.json)" -gt 0 ]; then
                if ! dvc repro benchmark/$game/dvc.yaml --single-item; then
                  echo "::error title=${model_name}::failed the ${game} pipeline"
                  failed="${failed} ${model_name}(${game})"
                fi
              fi
            done

            # Reclaim before the next model: 24 of these images do not fit.
            docker system prune -af --volumes > /dev/null 2>&1 || true
            df -h / | tail -1
            echo "::endgroup::"
          done

          if [ -n "$failed" ]; then
            echo "::error::failed:${failed}"
            exit 1
          fi

      - name: Report the result
        # always(): a failed run is exactly when the report is worth having.
        if: always() && steps.scope.outputs.changed_models != 'NONE'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTCOME: ${{ steps.validate_models.outcome }}
          # A fork's pull request gets a read-only token whatever the permissions
          # block asks for, so commenting on one 403s; the summary is the report.
          CAN_COMMENT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail

          summary=$(python - <<'PY'
          from pathlib import Path

          import polars as pl

          path = Path("benchmark/metrics.csv")
          # A run that failed before scoring leaves no file.
          if not path.exists() or path.stat().st_size == 0:
              print("_No metrics were produced._")
              raise SystemExit

          df = pl.read_csv(path)
          if df.height == 0:
              print("_No metrics were produced._")
              raise SystemExit

          keys = ["game", "model", "split"]
          metrics = [c for c, t in df.schema.items() if c not in keys and t.is_numeric()]
          summary = (
              df.group_by(keys)
              .agg(pl.len().alias("n_datasets"), *[pl.col(c).mean().round(3) for c in metrics])
              .sort(keys)
          )
          # Build the markdown by hand: polars' table printer wraps long headers.
          print("| " + " | ".join(summary.columns) + " |")
          print("|" + "---|" * len(summary.columns))
          for row in summary.iter_rows():
              print("| " + " | ".join(str(v) for v in row) + " |")
          PY
          )

          if [ "$OUTCOME" = "success" ]; then
            headline="✅ Every model built, ran and produced a scorable prediction set."
          else
            headline="❌ Validation failed. The per-model groups in the job log name the model and the stage."
          fi

          cat <<EOF > report.md
          ${headline}

          📈 Metrics averaged per model across datasets:

          ${summary}

          <sub>Scores on the dummy CI dataset are meaningless; this only checks
          that each model builds, runs and produces a scorable prediction set.</sub>
          EOF

          cat report.md >> "$GITHUB_STEP_SUMMARY"

          # --repo is explicit: for a model submission the git remote here is the
          # benchmark checkout, not the repository the PR number belongs to.
          if [ "$CAN_COMMENT" = "true" ]; then
            gh pr comment "${{ github.event.pull_request.number }}" \
              --repo "${{ github.repository }}" \
              --body-file report.md
          else
            echo "::notice::the report is in this job's summary; a fork pull request gets a read-only token and cannot be commented on"
          fi
