name: Sync Datasets from Hugging Face

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download manifests.json from Hugging Face
        run: |
          curl -o static/manifests.json \
            https://huggingface.co/datasets/ProteinGym/proteingym/raw/main/datasets.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/manifests.json
          git diff --staged --quiet || git commit -m "chore: sync datasets from Hugging Face"
          git push
