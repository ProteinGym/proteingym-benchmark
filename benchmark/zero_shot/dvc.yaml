vars:
  - default.yaml
  - datasets.json
  - models.json

stages:

  create_training_job:
    matrix:
      dataset: ${datasets}
      model: ${models}

    # Zero-shot models score all variants once; predictions do not depend on the
    # training fold, so there is no fold dimension. The model still requires a
    # --test-fold argument, so a fixed 0 is passed (it is ignored by the model).
    # Fix this in another PR for zero shot models.
    cmd: >-
      mkdir -p ${output.prediction}/${item.dataset.name}/${item.model.name}/${item.dataset.target}/${item.dataset.split} &&
      docker run --rm
      -v $(realpath ${item.dataset.input_filename}):/$(basename ${item.dataset.input_filename})
      -v $(realpath ${output.prediction}/${item.dataset.name}/${item.model.name}/${item.dataset.target}/${item.dataset.split}):/opt/program/output
      ${item.model.image}
      train
      --dataset-file /$(basename ${item.dataset.input_filename})
      --split ${item.dataset.split}
      --test-fold 0
      --target ${item.dataset.target}

    deps:
      - ../../models
      - ${item.dataset.input_filename}
    outs:
      - ${output.prediction}/${item.dataset.name}/${item.model.name}/${item.dataset.target}/${item.dataset.split}:
          cache: true

  calculate_metric:
    matrix:
      dataset: ${datasets}
      model: ${models}

    cmd:
    - >-
      METRIC_FLAGS=$(python -c "import yaml; d=yaml.safe_load(open('default.yaml')); print(' '.join(f'--selected-metrics {m}' for m in d['metrics']))");
      proteingym-base evaluate-zero-shot
      --prediction-path ${output.prediction}/${item.dataset.name}/${item.model.name}/${item.dataset.target}/${item.dataset.split}/${item.dataset.name}_predictions.pgdata
      --dataset-path ${item.dataset.input_filename}
      --metric-path ${output.metric}/${item.dataset.name}/${item.model.name}/${item.dataset.target}/${item.dataset.split}.json
      $METRIC_FLAGS
      --model-name ${item.model.name}
      --split ${item.dataset.split}
      --target ${item.dataset.target};

    deps:
      - ${item.dataset.input_filename}
      - ${output.prediction}/${item.dataset.name}/${item.model.name}/${item.dataset.target}/${item.dataset.split}/${item.dataset.name}_predictions.pgdata
    metrics:
      - ${output.metric}/${item.dataset.name}/${item.model.name}/${item.dataset.target}/${item.dataset.split}.json:
          cache: false

  aggregate_metrics:
    matrix:
      dataset: ${datasets}
      model: ${models}

    cmd: >
      PYTHONPATH=$(dvc root) python -m scripts.utils aggregate
      --metric-dir ${output.metric}
      --dataset-name ${item.dataset.name}
      --model-name ${item.model.name}
      --split ${item.dataset.split}
      --target ${item.dataset.target}
      --output-path ${output.metric}/${item.dataset.name}_${item.model.name}_${item.dataset.split}_${item.dataset.target}_aggregated.json

    deps:
      - ../../scripts/utils.py
      - ${output.metric}
    metrics:
      - ${output.metric}/${item.dataset.name}_${item.model.name}_${item.dataset.split}_${item.dataset.target}_aggregated.json:
          cache: false

  generate_metrics_csv:
    cmd: >
      PYTHONPATH=$(dvc root) python -m scripts.utils generate-csv
      --metric-dir ${output.metric}
      --output-path $(dvc root)/benchmark/metrics.csv
      --game zero_shot
    deps:
      - ../../scripts/utils.py
      - ${output.metric}