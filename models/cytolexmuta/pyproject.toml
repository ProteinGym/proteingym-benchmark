[project]
name = "proteingym-models-cytolexmuta"
version = "0.1.0"
description = "cytolexmuta zero-shot map-fusion model for ProteinGym2"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "biopython~=1.85",
    "biotite~=1.6.0",
    "typer~=0.16.0",
    "proteingym-base",
    "evedesign",
    "polars[pyarrow]~=1.31.0",
    "dill~=0.3.8",
    "fair-esm~=2.0.0",
    "joblib~=1.5.1",
    "numpy<2",
    "scikit-learn~=1.7.0",
    "scipy~=1.16.0",
    "torch>=2.6,<2.8",
    "torch-geometric~=2.6.1",
    "transformers==4.57.6",
]

[project.scripts]
cytolexmuta = "proteingym.models.cytolexmuta.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
proteingym-base = { git = "https://github.com/ProteinGym/proteingym-base.git" }

[tool.hatch.build.targets.wheel]
packages = ["src/proteingym", "src/torch_scatter"]

[tool.ruff]
line-length = 88

[dependency-groups]
dev = [
    "pytest~=8.4.1",
]
