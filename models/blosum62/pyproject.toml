[project]
name = "proteingym-models-blosum62"
version = "0.1.0"
description = "blosum62 model (evedesign-wrapped) submitted to ProteinGym"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer~=0.16.0",
    "proteingym-base",
    "evedesign",
    "polars[pyarrow]~=1.31.0",
    "dill~=0.3.8",
    # Bio.Align.substitution_matrices ships the NCBI matrix data files, so no
    # matrix is vendored or downloaded
    "biopython",
    "pandas",
    "numpy",
]

[project.scripts]
blosum62 = "proteingym.models.blosum62.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
proteingym-base = { git = "https://github.com/ProteinGym/proteingym-base.git" }

[tool.hatch.build.targets.wheel]
packages = ["src/proteingym"]

[tool.ruff]
line-length = 88

[dependency-groups]
dev = ["pytest~=8.4.1"]
