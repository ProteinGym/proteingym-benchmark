[project]
name = "proteingym-models-onexi-genesis"
version = "0.1.0"
description = "ONE XI Genesis zero-shot biophysical & context-conditioned mutation scorer (evedesign-wrapped) submitted to ProteinGym"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "typer~=0.16.0",
    "proteingym-base",
    "evedesign",
    "polars[pyarrow]~=1.31.0",
    "dill~=0.3.8",
    "biopython",
    "pandas",
    "numpy",
]

[project.scripts]
onexi_genesis = "proteingym.models.onexi_genesis.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
proteingym-base = { git = "https://github.com/ProteinGym/proteingym-base.git" }

[tool.hatch.build.targets.wheel]
packages = ["src/proteingym"]

[tool.ruff]
line-length = 88

[dependency-groups]
dev = ["pytest~=8.4.1"]
