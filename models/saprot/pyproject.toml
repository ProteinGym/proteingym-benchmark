[project]
name = "proteingym-models-saprot"
version = "0.1.0"
description = "saprot model (evedesign-wrapped) submitted to ProteinGym"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer~=0.16.0",
    "proteingym-base",
    "evedesign",
    "polars[pyarrow]~=1.31.0",
    "dill~=0.3.8",
    # build() asserts the MLM decoder is tied to / loaded alongside the word embeddings
    "transformers>=4.46,<5",
    "torch",
    # writing the target chain to a temporary PDB file for foldseek
    "biotite",
    "numpy",
    "pandas",
    "scipy",
]

[project.scripts]
saprot = "proteingym.models.saprot.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
proteingym-base = { git = "https://github.com/ProteinGym/proteingym-base.git" }

[tool.hatch.build.targets.wheel]
packages = ["src/proteingym"]

[tool.ruff]
line-length = 88

[dependency-groups]
dev = ["pytest~=8.4.1"]
