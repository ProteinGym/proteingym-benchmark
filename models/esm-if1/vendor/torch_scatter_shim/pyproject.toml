[project]
name = "torch_scatter"
version = "0.0.0"
description = "Minimal pure-PyTorch shim standing in for the real torch-scatter package"
requires-python = ">=3.12"
dependencies = ["torch"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["torch_scatter"]
